spring.application.name=negocio

spring.datasource.url=jdbc:mysql://localhost:3306/nanosland_db
spring.datasource.username=root
spring.datasource.password=itson
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Silenciar logs de arranque para consola interactiva limpia en los CLIs
spring.main.banner-mode=off
spring.main.allow-bean-definition-overriding=true
logging.level.root=WARN
logging.level.com.example.negocio=WARN
logging.level.com.mycompany=WARN
logging.level.org.hibernate=WARN
