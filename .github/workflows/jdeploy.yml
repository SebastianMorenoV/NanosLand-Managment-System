# Publica el instalador y las actualizaciones automáticas con jDeploy.
#
# - Al subir un tag "v1.2.3" se publica la versión 1.2.3 en GitHub Releases.
#   Las instalaciones existentes la descargan solas la próxima vez que se abren.
# - Al subir a una rama terminada en "-snapshot" se publica una versión de
#   prueba (prerelease) con el nombre de la rama.
#
# El nombre del tag o de la rama no puede pasar de 16 caracteres.
name: Publicar instalador (jDeploy)

on:
  push:
    tags:
      - 'v*'
    branches:
      - '*-snapshot'

permissions:
  contents: write

concurrency:
  group: jdeploy-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar con Maven
        run: mvn -B clean package -DskipTests

      - name: Publicar con jDeploy
        uses: shannah/jdeploy@master
        with:
          github_token: ${{ github.token }}

      # jDeploy deja el release del tag como borrador; aquí se publica y se le
      # ponen como notas los enlaces de descarga de los instaladores.
      - name: Publicar el release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" -p jdeploy-release-notes.md --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest --notes-file jdeploy-release-notes.md
