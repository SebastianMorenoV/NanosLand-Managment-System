spring.application.name=Persistencia

spring.datasource.url=jdbc:mysql://localhost:3306/nanosland_db?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=itson
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Lee y escribe fechas y horas (LocalDate/LocalTime/LocalDateTime) tal cual, sin pasar
# por java.util.Calendar. Evita el error "HOUR_OF_DAY: 0 -> 1" al leer horas entre
# 00:00 y 00:59 en zonas como Sonora, y guarda las fechas-hora en hora local.
spring.jpa.properties.hibernate.type.java_time_use_direct_jdbc=true
